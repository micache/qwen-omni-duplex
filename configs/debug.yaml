model:
  name: Qwen/Qwen2.5-Omni-3B
  revision: f75b40e3da2003cdd6e1829b1f420ca70797c34e
  component: thinker
  local_files_only: true
  load_in_4bit: false

timeline:
  chunk_seconds: 2.0
  frame_rate_hz: 25
  control_events: [IDLE, START, STOP]
  control_token_source: thinker_native

task:
  fusion: additive_audio_text_control
  objective: weighted_next_event
  output: text_only

data:
  dataset: DailyTalkContiguous
  root: /workspace/data/DailyTalkContiguous-session09
  manifest: dailytalk.jsonl
  synthetic_interruption: true
  synthetic_smoke: false
  interruption_probability: 1.0
  min_assistant_frames: 4
  selected_windows:
    - conversation_id: data_stereo/1292
      start_seconds: 0.0
      end_seconds: 2.0
      kind: random
      assistant_word_indices: [0]
      synthetic_user_audio:
        start_seconds: 1.68
        end_seconds: 2.0
    - conversation_id: data_stereo/2196
      start_seconds: 0.0
      end_seconds: 2.0
      kind: random
      assistant_word_indices: [0]
    - conversation_id: data_stereo/382
      start_seconds: 1.3
      end_seconds: 3.3
      kind: random
      assistant_word_indices: [0, 1]
    - conversation_id: data_stereo/1942
      start_seconds: 29.0
      end_seconds: 31.0
      kind: random
      assistant_word_indices: [47, 48]

loss_weights:
  text: 1.0
  idle: 0.25
  start: 4.0
  stop: 4.0

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_projections: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  method: lora
  run_label: LoRA
  output_dir: outputs/session09-overfit-native
  max_steps: 150
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: constant
  weight_decay: 0.0
  warmup_steps: 0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  eval_strategy: "no"
  eval_steps: null
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  optimizer: adamw_torch
  dataloader_num_workers: 0
  auto_find_batch_size: false
  full_determinism: false
  seed: 17
  split_seed: 18
  window_seed: 19
  interruption_seed: 20
  resume_from_checkpoint: null

logging:
  backends: [jsonl]
  steps: 1
  disable_tqdm: false
